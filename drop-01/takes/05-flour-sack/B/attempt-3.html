  "content": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title></title>\n<style>\n  html,body{margin:0;padding:0;height:100%;background:#0b0c0e;overflow:hidden}\n  body{display:flex;align-items:center;justify-content:center}\n  canvas{display:block;box-shadow:0 0 0 1px rgba(255,255,255,.04)}\n</style>\n</head>\n<body>\n<canvas id=\"s\"></canvas>\n<script>\n(function(){\n\"use strict\";\nvar CW=960,CH=540,GY=428,T=24.0,W0=76,H0=192,G=900;\nvar cv=document.getElementById('s');\nvar dpr=Math.min(2,window.devicePixelRatio||1);\ncv.width=CW*dpr;cv.height=CH*dpr;cv.style.width=CW+'px';cv.style.height=CH+'px';\nvar ctx=cv.getContext('2d');ctx.scale(dpr,dpr);\n\nfunction clamp(v,a,b){return v<a?a:(v>b?b:v);}\nfunction ss(x){x=clamp(x,0,1);return x*x*(3-2*x);}\n\nvar EA={\n  lin:function(t){return t;},\n  \"in\":function(t){return t*t;},\n  out:function(t){return 1-(1-t)*(1-t);},\n  io:function(t){return t<0.5?2*t*t:1-2*(1-t)*(1-t);},\n  io3:function(t){return t<0.5?4*t*t*t:1-4*(1-t)*(1-t)*(1-t);},\n  outB:function(t){var c=2.0;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}\n};\n\n/* ---- pose timeline : sq squash | lean top-offset | bend bow | rot deg | slump collapse | ear tension | x drift | lift height | breath | bf breath-rate ---- */\nvar KEYS=[\n[0.00,{sq:1.00,lean:0,bend:0,rot:0,slump:0.14,ear:0.36,x:0,lift:0,breath:1.0,bf:0.42}],\n[1.30,{sq:[1.00,'lin'],lean:[0,'lin'],slump:[0.14,'lin'],ear:[0.36,'lin'],breath:[1.0,'lin'],bf:[0.42,'lin']}],\n/* I. DEJECTION -- the weight comes on slowly */\n[2.70,{sq:0.88,slump:0.56,ear:0.06,lean:-6,bend:-4,rot:-1.6,breath:0.62,bf:0.30}],\n[3.70,{sq:0.80,slump:0.82,lean:-10,bend:-6,rot:-2.6}],\n[4.20,{sq:[0.91,'out'],slump:[0.62,'out'],ear:[0.20,'out']}],\n[5.05,{sq:[0.745,'in'],slump:[0.93,'in'],ear:[0.0,'in'],lean:-13}],\n[6.40,{sq:0.725,slump:0.96,lean:-16,bend:-8,rot:-4.6,x:-18,breath:0.5,bf:0.24}],\n[7.00,{sq:[0.80,'out'],slump:[0.78,'out']}],\n[7.90,{sq:[0.705,'in'],slump:[1.0,'in'],lean:-19,rot:-6.2,x:-27}],\n[8.18,{sq:0.70,slump:1.0}],\n/* something is noticed */\n[8.26,{sq:[0.64,'in'],ear:[0.06,'lin'],lift:[0,'lin']}],\n[8.46,{sq:[1.26,'outB'],slump:[0.0,'out'],ear:[1.0,'outB'],lean:[2,'out'],bend:[2,'out'],rot:[0,'out'],breath:0.22,bf:1.3}],\n[8.62,{lift:[18,'out']}],\n[8.70,{sq:1.02}],\n[8.88,{lift:[0,'in'],sq:[0.90,'in']}],\n[9.00,{sq:[1.13,'outB']}],\n/* II. CURIOSITY -- tall, light, checking things out */\n[9.40,{sq:1.08,lean:0,bend:0,breath:0.34,bf:0.95}],\n[9.95,{lean:16,rot:3,bend:6}],\n[10.35,{lean:[16,'lin'],rot:[3,'lin']}],\n[10.50,{lean:[-18,'io'],rot:[-3.6,'io'],bend:[-7,'io']}],\n[10.62,{sq:[0.80,'in'],lift:[0,'lin'],x:[-26,'lin']}],\n[10.74,{sq:[1.26,'out'],rot:[-6,'out'],x:[-32,'out']}],\n[10.94,{lift:[26,'out'],sq:[1.06,'io'],x:[-46,'lin']}],\n[11.14,{lift:[0,'in'],sq:[0.82,'in'],x:[-54,'out'],rot:[-2,'out']}],\n[11.26,{sq:[1.16,'outB'],lean:[-8,'io']}],\n[11.44,{sq:[0.82,'in'],lift:[0,'lin'],x:[-54,'lin']}],\n[11.56,{sq:[1.24,'out'],rot:[4,'out'],lean:[8,'io'],x:[-46,'out']}],\n[11.76,{lift:[26,'out'],sq:[1.06,'io'],x:[-26,'lin']}],\n[11.96,{lift:[0,'in'],sq:[0.82,'in'],x:[-14,'out'],rot:[1,'out']}],\n[12.08,{sq:[1.16,'outB']}],\n[12.30,{sq:1.06,lean:6}],\n[12.90,{lean:26,bend:14,sq:0.97,rot:5,x:0}],\n[13.50,{lean:[30,'lin'],bend:[16,'lin'],sq:[0.96,'lin']}],\n[13.72,{lean:[-6,'out'],bend:[-4,'out'],rot:[-2,'out'],sq:[1.10,'out']}],\n[13.92,{lean:[20,'out'],bend:[10,'out'],rot:[4,'out']}],\n[14.12,{lean:[4,'io'],bend:[2,'io'],rot:[0,'io'],sq:[1.08,'io'],x:[0,'lin']}],\n[14.45,{sq:1.02,lean:-5,breath:0.55,bf:3.4}],\n[14.85,{sq:1.06,lean:5}],\n/* III. JOY -- it cannot keep still */\n[15.10,{sq:[0.70,'in'],lean:[0,'io'],bend:[0,'io'],x:[0,'io'],lift:[0,'lin'],breath:0.3,bf:4.2}],\n[15.32,{sq:[1.36,'out'],lift:[8,'out'],x:[-8,'out']}],\n[15.72,{lift:[104,'out'],sq:[1.06,'io'],rot:[-9,'io'],x:[-38,'lin'],lean:[-10,'io']}],\n[16.16,{lift:[0,'in'],sq:[0.72,'in'],x:[-60,'out'],rot:[0,'out'],lean:[8,'io']}],\n[16.30,{sq:[1.24,'outB']}],\n[16.46,{sq:[0.78,'in'],lift:[0,'lin'],x:[-60,'lin']}],\n[16.66,{sq:[1.38,'out'],lift:[8,'out'],x:[-52,'out']}],\n[17.10,{lift:[124,'out'],sq:[1.04,'io'],rot:[10,'io'],x:[-6,'lin'],lean:[12,'io']}],\n[17.58,{lift:[0,'in'],sq:[0.72,'in'],x:[38,'out'],rot:[0,'out'],lean:[-8,'io']}],\n[17.72,{sq:[1.26,'outB']}],\n[17.88,{sq:[0.78,'in'],lift:[0,'lin'],x:[38,'lin']}],\n[18.06,{sq:[1.34,'out'],lift:[8,'out'],x:[32,'out']}],\n[18.46,{lift:[96,'out'],sq:[1.05,'io'],rot:[-7,'io'],x:[8,'lin'],lean:[-8,'io']}],\n[18.90,{lift:[0,'in'],sq:[0.72,'in'],x:[-14,'out'],rot:[0,'out'],lean:[6,'io']}],\n[19.04,{sq:[1.22,'outB']}],\n/* a full head-over-heels */\n[19.22,{sq:[0.70,'in'],lean:[0,'io'],lift:[0,'lin'],x:[-14,'lin']}],\n[19.46,{sq:[1.40,'out'],lift:[10,'out'],rot:[0,'lin'],x:[-10,'out']}],\n[20.00,{lift:[132,'out'],sq:[1.00,'io'],x:[2,'lin']}],\n[20.56,{lift:[0,'in'],sq:[0.70,'in'],rot:[360,'io3'],x:[12,'out']}],\n[20.70,{sq:[1.28,'outB'],rot:[360,'lin']}],\n[20.88,{sq:[0.86,'in'],lift:[0,'lin']}],\n[20.98,{sq:[1.20,'out'],lean:[10,'io'],rot:[367,'io']}],\n[21.12,{lift:[42,'out'],sq:[1.04,'io']}],\n[21.30,{lift:[0,'in'],sq:[0.84,'in'],lean:[-8,'io'],rot:[353,'io']}],\n[21.40,{sq:[1.16,'outB']}],\n[21.56,{sq:[0.88,'in'],lift:[0,'lin']}],\n[21.66,{sq:[1.18,'out'],lean:[8,'io'],rot:[364,'io']}],\n[21.80,{lift:[38,'out'],sq:[1.04,'io']}],\n[21.98,{lift:[0,'in'],sq:[0.86,'in'],lean:[-4,'io'],rot:[360,'io']}],\n[22.08,{sq:[1.12,'outB']}],\n/* settle back to where it began */\n[22.70,{sq:1.09,lean:0,bend:0,rot:360,x:0,ear:0.86,breath:0.5,bf:1.7}],\n[23.40,{sq:1.02,slump:0.06,ear:0.52,breath:0.8,bf:0.9}],\n[24.00,{sq:1.00,lean:0,bend:0,rot:360,slump:0.14,ear:0.36,x:0,lift:0,breath:1.0,bf:0.42}]\n];\n\nvar TR={};\n(function(){\n  for(var i=0;i<KEYS.length;i++){\n    var t=KEYS[i][0],o=KEYS[i][1];\n    for(var k in o){\n      var v=o[k],e='io';\n      if(Object.prototype.toString.call(v)==='[object Array]'){e=v[1];v=v[0];}\n      if(!TR[k])TR[k]=[];\n      TR[k].push([t,v,e]);\n    }\n  }\n})();\n\nfunction samp(a,t){\n  var n=a.length;\n  if(t<=a[0][0])return a[0][1];\n  if(t>=a[n-1][0])return a[n-1][1];\n  var i=1;while(a[i][0]<t)i++;\n  var A=a[i-1],B=a[i];\n  var u=(t-A[0])/(B[0]-A[0]);\n  var f=EA[B[2]]||EA.io;\n  return A[1]+(B[1]-A[1])*f(u);\n}\nfunction poseAt(t){var o={};for(var k in TR)o[k]=samp(TR[k],t);return o;}\n\n/* ---- silhouette width profile along the spine ---- */\nvar WP=[0.76,0.93,1.00,0.98,0.90,0.72,0.46,0.33];\nfunction profile(u){\n  var n=WP.length-1,s=clamp(u,0,1)*n;\n  var i=Math.min(n-1,Math.floor(s)),f=s-i;\n  var p0=WP[Math.max(0,i-1)],p1=WP[i],p2=WP[i+1],p3=WP[Math.min(n,i+2)];\n  return 0.5*((2*p1)+(-p0+p2)*f+(2*p0-5*p1+4*p2-p3)*f*f+(-p0+3*p1-3*p2+p3)*f*f*f);\n}\n\n/* ---- secondary motion : soft body + corner tufts ---- */\nvar S={sq:1,sqv:0,lean:0,leanv:0,slump:0.14,slumpv:0,jig:0,jigv:0,lat:0,latv:0,load:0,loadv:0,swing:0,swingv:0};\n(function(){var p=poseAt(0);S.sq=p.sq;S.lean=p.lean;S.slump=p.slump;})();\n\nfunction step(p,Ax,Ay,dt){\n  var v;\n  v=S.sqv+(900*(p.sq*(1+p.breathMod)-S.sq)-42*S.sqv)*dt;S.sqv=v;S.sq+=v*dt;\n  v=S.leanv+(210*(p.lean-S.lean)-17*S.leanv)*dt;S.leanv=v;S.lean+=v*dt;\n  v=S.slumpv+(320*(p.slump-S.slump)-26*S.slumpv)*dt;S.slumpv=v;S.slump+=v*dt;\n  v=S.jigv+(-1400*S.jig-34*S.jigv+34*S.sqv)*dt;S.jigv=v;S.jig=clamp(S.jig+v*dt,-0.30,0.30);\n  var drive=S.leanv/60+p.xv/130;\n  v=S.latv+(-900*S.lat-26*S.latv+40*drive)*dt;S.latv=v;S.lat=clamp(S.lat+v*dt,-0.14,0.14);\n  var gEff=G+Ay;\n  v=S.loadv+(500*((gEff/G-1)*15-S.load)-16*S.loadv)*dt;S.loadv=v;S.load=clamp(S.load+v*dt,-26,30);\n  v=S.swingv+(600*((-Ax/G)*30-S.swing)-17*S.swingv)*dt;S.swingv=v;S.swing=clamp(S.swing+v*dt,-46,46);\n}\n\n/* ---- static backdrop ---- */\nvar bg=document.createElement('canvas');bg.width=CW;bg.height=CH;\n(function(){\n  var c=bg.getContext('2d');\n  var g=c.createLinearGradient(0,0,0,CH);\n  g.addColorStop(0,'#23252c');g.addColorStop(0.50,'#1a1c21');g.addColorStop(0.80,'#141519');g.addColorStop(1,'#0f1013');\n  c.fillStyle=g;c.fillRect(0,0,CW,CH);\n  c.save();c.translate(CW/2,GY+8);c.scale(1,0.13);\n  var r=c.createRadialGradient(0,0,0,0,0,400);\n  r.addColorStop(0,'rgba(255,238,205,0.15)');r.addColorStop(0.5,'rgba(255,238,205,0.06)');r.addColorStop(1,'rgba(255,238,205,0)');\n  c.fillStyle=r;c.beginPath();c.arc(0,0,400,0,6.2832);c.fill();c.restore();\n  var v=c.createRadialGradient(CW/2,CH*0.44,140,CW/2,CH*0.44,640);\n  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.55)');\n  c.fillStyle=v;c.fillRect(0,0,CW,CH);\n})();\n\nfunction closedPath(pts){\n  var n=pts.length;\n  ctx.beginPath();\n  ctx.moveTo((pts[n-1].x+pts[0].x)/2,(pts[n-1].y+pts[0].y)/2);\n  for(var i=0;i<n;i++){\n    var a=pts[i],b=pts[(i+1)%n];\n    ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);\n  }\n  ctx.closePath();\n}\n\nvar N=44;\n\nfunction render(t,p){\n  ctx.clearRect(0,0,CW,CH);\n  ctx.drawImage(bg,0,0);\n\n  var sq=S.sq,lean=S.lean,slump=S.slump,ear=p.ear,lift=p.lift;\n  var cx=CW/2+p.x,rot=p.rot*Math.PI/180;\n  var air=ss(lift/55);\n\n  var Hh=H0*sq*(1-0.15*slump);\n  var wS=Math.pow(Math.max(0.45,sq),-0.5);\n\n  var P0x=0,P0y=0;\n  var P1x=p.bend*0.55,P1y=-Hh*0.30;\n  var P2x=lean*0.55+p.bend*0.45,P2y=-Hh*0.72;\n  var P3x=lean*(1+0.5*slump),P3y=-Hh+slump*Hh*0.13;\n\n  var sp=[],i,u,iu;\n  for(i=0;i<=N;i++){\n    u=i/N;iu=1-u;\n    var x=iu*iu*iu*P0x+3*iu*iu*u*P1x+3*iu*u*u*P2x+u*u*u*P3x+S.lat*170*Math.sin(u*2.3)*u;\n    var y=iu*iu*iu*P0y+3*iu*iu*u*P1y+3*iu*u*u*P2y+u*u*u*P3y;\n    sp.push({u:u,x:x,y:y});\n  }\n  for(i=0;i<=N;i++){\n    var a=sp[Math.max(0,i-1)],b=sp[Math.min(N,i+1)];\n    var dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;\n    sp[i].tx=dx/L;sp[i].ty=dy/L;sp[i].nx=-dy/L;sp[i].ny=dx/L;\n  }\n  var wA=[];\n  for(i=0;i<=N;i++){\n    u=sp[i].u;\n    var w=W0*profile(u);\n    w*=1+slump*(0.22-0.72*u);\n    w*=wS;\n    w*=1+(1-sq)*0.45*Math.max(0,1-u*2.0);\n    w*=1+S.jig*0.70*Math.sin(u*4.4-0.7);\n    wA.push(Math.max(3,w));\n  }\n\n  var pv=Hh*0.5*ss(lift/60);\n  va
