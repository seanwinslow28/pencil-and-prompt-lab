/* ---------- shaded capsule rasterizer ---------- */
const LX=.507,LY=-.862;
function cap(a,b,r0,r1,mode,col,o){

 const x0=Math.floor(Math.min(a[0]-R0,b[0]-R1)),x1=Math.ceil(Math.max(a[0]+R0,b[0]+R1));
 const y0=Math.floor(Math.min(a[1]-R0,b[1]-R1)),y1=Math.ceil(Math.max(a[1]+R0,b[1]+R1));
 const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1e-4,len=Math.sqrt(L2);
 for(let y=y0;y<=y1;y++){if(y<0||y>=H)continue;
  for(let x=x0;x<=x1;x++){if(x<0||x>=W)continue;
   const cx=x+.5,cy=y+.5;let t=((cx-a[0])*dx+(cy-a[1])*dy)/L2;t=t<0?0:t>1?1:t;
   const ex=cx-a[0]-dx*t,ey=cy-a[1]-dy*t,r=R0+(R1-R0)*t,d2=ex*ex+ey*ey;

   const nx=ex/r,ny=ey/r,nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny)),s=nx*LX+ny*LY+.4*nz;
   let k=s>.55?2:s>-.08?1:0;
   if(o){

   }

}
function grp(ps,oc){oc=oc||1;for(const p of ps)cap(p.a,p.b,p.r0,p.r1,0,oc);for(const p of ps)cap(p.a,p.b,p.r0,p.r1,1,p.c,p.o);}

/* ---------- rig ---------- */
function ik(ax,ay,tx,ty,l1,l2,bend){

 return{jx:ax+Math.cos(ja)*l1,jy:ay+Math.sin(ja)*l1,ex:ax+Math.cos(a)*dd,ey:ay+Math.sin(a)*dd};
}
function armIK(sh,tg){const k=ik(sh[0],sh[1],tg[0],tg[1],14,14,1);const el=[k.jx,k.jy],h=[k.ex,k.ey];const dx=h[0]-el[0],dy=h[1]-el[1],l=Math.hypot(dx,dy)||1;return{sh,el,h,d:[dx/l,dy/l]};}

  head:[Math.round(neck[0]+u[0]*3),Math.round(neck[1]+u[1]*3)],nA:armIK(nSh,Pz.nh),fA:armIK(fSh,Pz.fh)};
}

/* ---------- heavy bag placed where the cross lands ---------- */
const hitSk=skel(POSE.hit);
const FX=hitSk.nA.h[0]+hitSk.nA.d[0]*5.2,FY=hitSk.nA.h[1]+hitSk.nA.d[1]*5.2;

const bag={th:0,w:0,jit:0},K=.0045,C=.05;
function inBag(lx,ly,g,dent){
 const R=BR+g,L=BL+g,cr=5+g;if(ly<-g||ly>L)return false;let lim=R;
 if(ly<-g+cr){const e=(-g+cr)-ly;lim=R-cr+Math.sqrt(Math.max(0,cr*cr-e*e));}

 for(let s=0;s<=CHAIN-8;s++){const x=pvx+ax*s,y=pvy+ay*s;if((s>>1)&1)P(x,y,23);else{P(x-1,y,16);P(x,y,22);P(x+1,y,16);}}
 cap(rg,rg,1.6,1.6,0,16);cap(rg,rg,1.6,1.6,1,[22,23,23]);
 const ex=tx+ax*BL;
 const bx0=Math.floor(Math.min(tx,ex)-BR-3),bx1=Math.ceil(Math.max(tx,ex)+BR+3);

  const rx=x+.5-tx,ry=y+.5-ty,ly=rx*ax+ry*ay,lx=rx*lxv+ry*lyv;

  else c=[17,18,19][k];
  if(dent>.6&&Math.abs(ly-DY)<4&&lx<-BR+dent+2.2)c=17;
  P(x,y,c);
 }
}

  if(y<99)c=14;else if(y<107)c=y===99?((x+y)&1?14:15):15;else if(y<119)c=y===107?((x+y)&1?15:16):16;else c=y===119?((x+y)&1?16:17):17;

 for(let i=0;i<44;i++){const x=Math.floor(hsh(i,9)*W),y=100+Math.floor(hsh(i,10)*32);if(Math.abs(x-SX)<28)continue;const l=2+(i%2);for(let k=0;k<l;k++)B(x+k,y,21+i%3);}
 const posts=[30,86,142,198,254,310],rp=[-26].concat(posts,[366]);
 for(let i=0;i<rp.length-1;i++){const a=rp[i],b=rp[i+1];for(let x=a+4;x<b;x++){const t=(x-a)/(b-a);for(const y0 of[120,127])B(x,y0+Math.round(2.5*Math.sin(Math.PI*t)),26);}}
 for(const p of posts){for(let y=113;y<134;y++){B(p,y,24);B(p+1,y,24);B(p+2,y,25);B(p+3,y,24);}for(let x=p;x<p+4;x++)B(x,112,25);}
 for(const p of[86,254]){B(p+1,102,24);B(p+1,103,24);for(let x=p-1;x<=p+4;x++)for(let y=104;y<=111;y++){const e=x===p-1||x===p+4||y===104||y===111;B(x,y,e?24:(y===110?28:27));}}
 for(let x=X0;x<X1;x++){B(x,134,33);B(x,135,32);B(x,136,29);}
 for(let y=137;y<H+M;y++){const dp=y-50;for(let x=X0;x<X1;x++){
  const X=(x+.5-160)*40/dp,pf=X/5,pl=Math.floor(pf),fr=pf-pl,pw=5*dp/40;
  if(fr*pw<1){B(x,y,29);continue;}
  const off=hsh(pl,3)*30;if(Math.floor((2400/dp+off)/8)!==Math.floor((2400/(dp-1)+off)/8)){B(x,y,29);continue;}
  let c=hsh(pl,7)<.5?30:31;const lt=.75*(1-(y-137)/47)+.35*((x-160)/160)+((x+y)&1?.03:-.03);
  c=Math.min(33,c+(lt>.62?2:lt>.3?1:0));if(hsh(x,y)<.03)c=Math.max(30,c-1);B(x,y,c);}}
 const px=Math.round(PIVX),post=px+34;
 for(let x=post-7;x<=post+12;x++)for(let y=146;y<=152;y++){const e=x===post-7||x===post+12||y===146||y===152;B(x,y,e?34:(y===147?37:35));}
 for(let y=28;y<=146;y++){B(post,y,34);B(post+1,y,35);B(post+2,y,36);B(post+3,y,36);B(post+4,y,37);B(post+5,y,34);}
 for(let i=0;i<=17;i++){const x=post-1-i,y=52-i;B(x,y-1,34);B(x,y,36);B(x,y+1,35);B(x,y+2,34);}
 for(let x=px-10;x<=post+9;x++){B(x,28,34);B(x,29,37);B(x,30,36);B(x,31,36);B(x,32,35);B(x,33,34);}
 for(let y=28;y<=33;y++){B(px-10,y,34);B(post+9,y,34);}
 for(let x=px-2;x<=px+2;x++){B(x,34,34);B(x,35,34);}
}
drawBG();

/* ---------- fx ---------- */
function spark(x,y,a){
 const rays=(rin,L1,L2,w,fc,ec,rot)=>{const sg=[];for(let i=0;i<8;i++){const an=(i*45+rot)*D,L=i%2?L2:L1;if(L<=rin)continue;
   sg.push([[x+Math.cos(an)*rin,y+Math.sin(an)*rin],[x+Math.cos(an)*L,y+Math.sin(an)*L]]);}
  for(const s of sg)cap(s[0],s[1],w,.3,0,ec);for(const s of sg)cap(s[0],s[1],w,.3,1,fc);};
 const disc=(r,fc,ec)=>{cap([x,y],[x,y],r,r,0,ec);cap([x,y],[x,y],r,r,1,fc);};
 const ring=(r,c,dith)=>{for(let yy=Math.floor(y-r-1);yy<=y+r+1;yy++)for(let xx=Math.floor(x-r*.5-1);xx<=x+r*.5+1;xx++){
   const e=Math.hypot((xx+.5-x)/.5,yy+.5-y);if(Math.abs(e-r)<.8&&!(dith&&((xx+yy)&1)))P(xx,yy,c);}};
 if(a<=2){rays(0,a?20:15,a?12:9,2.8,32,34,0);disc(a?7:6,32,33);}
 else if(a<=5){const k=a-3;ring(8+k*3,33,0);rays(3+k*2,22+k,14+k,2.3,33,35,22.5);disc(4-k,33,34);}
 else if(a<=9){const k=a-6;ring(17+k*2,35,1);rays(12+k*3,19+k*3,15+k*2,1.6,34,36,k%2?10:0);}
 else if(a<=15){const k=a-10;for(let i=0;i<8;i++){if(k>3&&(i&1))continue;const an=(i*45+22.5+k*4)*D,R=20+k*2.2,p=[x+Math.cos(an)*R,y+Math.sin(an)*R];
  cap(p,p,1.2,1.2,0,36);cap(p,p,1.2,1.2,1,k<3?34:35);}}
}
function speedLines(A){const{h,d}=A,px=-d[1],py=d[0];
 for(const[o,l0,l1]of[[-7,6,20],[-3.5,10,26],[5,8,22],[9,12,19]])
  cap([h[0]-d[0]*l0+px*o,h[1]-d[1]*l0+py*o],[h[0]-d[0]*l1+px*o,h[1]-d[1]*l1+py*o],.6,.3,1,39);}
let parts=[];
function dust(x,y,vx,vy,life){parts.push({x,y,vx,vy,age:0,life});}
function drawDust(){for(const p of parts){const k=p.age/p.life,r=1.6+k*2.6;
 for(let yy=Math.floor(p.y-r);yy<=p.y+r;yy++)for(let xx=Math.floor(p.x-r);xx<=p.x+r;xx++){
  const dx=xx+.5-p.x,dy=yy+.5-p.y;if(dx*dx+dy*dy>r*r)continue;
  if(k>.5&&((xx+yy)&1))continue;if(k>.8&&(((xx>>1)+(yy>>1))&1))continue;P(xx,yy,dy>r*.2?38:37);}}}
function ell(cx,cy,rx,ry,solid){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
 if(x<0||x>=W||y<0||y>=H)continue;const e=((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2;if(e>1)continue;if(e>solid&&((x+y)&1))continue;shad[y*W+x]=1;}}

/* ---------- simulation ---------- */
const SHX=[3,-2,2,-2,1,-1,1,-1,0,0],SHY=[-1,1,0,-1,1,0,0,0,0,0];
let tick=0,wt=0,shx=0,shy=0,cur={name:'idle',lt:0};
function update(){
 const r=seqAt(tick%LOOP),name=r[0],lt=r[1];cur={name,lt};
 const hs=name==='hit'&&lt<HS;
 if(hs){shx=SHX[lt];shy=SHY[lt];bag.jit=lt<HS-2?(lt&1?1:-1):0;}
 else{shx=shy=0;bag.jit=0;wt++;if(wt%5===0)wq=wt;
  wind+=(POSE[name].wind-wind)*.25;
  bag.w+=-K*bag.th-C*bag.w;bag.th+=bag.w;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.88;p.vy*=.9;p.age++;}
  parts=parts.filter(p=>p.age<p.life);}
 if(name==='smear'&&lt===0){dust(POSE.smear.ff[0]+6,156,.6,-.15,16);dust(POSE.smear.ff[0]-2,156,-.4,-.1,13);}
 if(name==='hit'&&lt===HS){bag.w+=.024;dust(POSE.hit.nf[0]+5,157,-.7,-.12,14);}
 if(name==='rec2'&&lt===0)dust(POSE.rec2.ff[0]+4,156,-.3,-.08,11);
 tick++;
}
function render(){
 const r=Math.floor(wt/7),g=Math.floor(wt/11);
 for(let i=0;i<3;i++){setBG(18+i,CYC[(i+r)%3]);setBG(21+i,GLI[(i+g)%3]);}
 setBG(27,hsh(wt>>2,5)<.25?'#ffb040':'#ffcc55');setBG(40,((wt>>5)&1)?'#c0a8e0':'#7a6aa8');
 buf.fill(0);shad.fill(0);
 const{name,lt}=cur,Pz=poseFor(name,lt),sk=skel(Pz);
 ell((Pz.nf[0]+Pz.ff[0])/2+2,158.5,(Pz.ff[0]-Pz.nf[0])/2+10,2.8,.5);
 ell(PIVX+Math.sin(bag.th)*(CHAIN+BL),158.5,8,1.8,0);
 let dent=0;if(name==='hit')dent=lt<HS?3.4:3.4*Math.pow(.55,lt-HS+1);
 drawBag(dent,name==='hit'&&lt<2);
 if(name==='smear'||(name==='hit'&&lt<5))speedLines(sk.nA);
 const trail=name==='smear'?[[POSE.idle.nh[0],POSE.idle.nh[1]],sk.nA.h]:null;
 drawChar(Pz,sk,Pz.face,trail);
 drawDust();
 if(name==='hit'&&lt<=15)spark(FX,FY,lt);
 let o=0;
 for(let y=0;y<H;y++){const wy=y-shy;for(let x=0;x<W;x++,o++){const wx=x-shx;
  if(wx>=0&&wx<W&&wy>=0&&wy<H){const i=wy*W+wx,s=buf[i];if(s){o32[o]=SP[s];continue;}
   const b=bgBuf[(wy+M)*BW+wx+M];o32[o]=shad[i]?bgD[b]:bgP[b];}
  else o32[o]=bgP[bgBuf[(wy+M)*BW+wx+M]];}}
 ctx.putImageData(img,0,0);
}
update();render();
let acc=0,last=performance.now();const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;let n=0;
 while(acc>=STEP){update();acc-=STEP;n++;}if(n)render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
